[project]
name = "law-crawler-rpa-rag-mcp"
version = "0.2.0"
description = "A Python toolkit for crawling, normalizing, and exporting Chinese legal and regulatory documents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Law Crawler contributors" }]
keywords = ["law", "crawler", "rag", "mcp", "legal-tech", "china-law"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.2",
    "lxml>=4.9.3",
    "pandas>=2.0.3",
    "openpyxl>=3.1.2",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "toml>=0.10.2",
    "loguru>=0.7.0",
    "httpx>=0.25.0",
    "aiohttp>=3.9.0",
    "Brotli>=1.1.0",
    "jinja2>=3.1.0",
    "PyYAML>=6.0",
    "selenium>=4.15.0",
    "webdriver-manager>=4.0.0",
    "tenacity>=8.2.0",
    "fake-useragent>=1.4.0",
    "jieba>=0.42.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.4.0",
    "mkdocstrings[python]>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
